<style>
  :root {
    --road-h: 112px;
    --ink: #1f2430;
    --paper: #fffaf0;
    --accent: #ff7a59;
    --chosen: #2fa36b;
    --ghost: #8a8fa3;
    --dark: 0;               /* 0 = morning, 1 = night (set by JS) */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Nunito", system-ui, sans-serif; color: var(--ink);
    background: repeating-linear-gradient(90deg, #f4ede1 0 34px, #efe6d7 34px 68px);
  }

  /* ================= landing page: a photo on the wall ================= */
  #game {
    position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 1; overflow: hidden;
    transform-origin: 0 0; touch-action: none; user-select: none; -webkit-user-select: none; background: #000;
  }
  body:not(.in-game) #game { pointer-events: none; }
  body:not(.ready) #game { visibility: hidden; }
  body:not(.in-game) .hud-top, body:not(.in-game) .hint, body:not(.in-game) .pad { opacity: 0; visibility: hidden; }
  .hud-top, .hint, .pad { transition: opacity .5s; }
  #home {
    position: fixed; inset: 0; z-index: 2; overflow-y: auto; transition: opacity .55s ease;
  }
  body.entering #home { opacity: 0; pointer-events: none; }
  .home-inner {
    max-width: 1120px; min-height: 100%; margin: 0 auto; padding: 48px 40px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 64px; row-gap: 44px; align-items: start;
    align-content: start;
  }
  .words { max-width: 33rem; }
  /* name + role: one row across the whole page */
  .hero {
    grid-column: 1 / -1; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 22px;
    padding-bottom: 14px; border-bottom: 2px solid #1f243014; margin-bottom: -16px;
  }
  .hero h1 { font-size: 54px; line-height: 1; margin: 0; }
  .hero h1 span { color: var(--accent); }
  .hello { font: 600 15px "Fredoka", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .words p.story { font-size: 20px; line-height: 1.65; margin: 0 0 18px; color: #3a3f4c; }
  .words p.story .quiet { color: #8a8478; }
  /* words that are places on the road */
  .place {
    --c: var(--accent);
    font: inherit; font-weight: 800; color: var(--ink); background: none; border: 0; padding: 0 1px; cursor: pointer;
    background-image: linear-gradient(color-mix(in srgb, var(--c) 38%, transparent), color-mix(in srgb, var(--c) 38%, transparent));
    background-size: 100% 38%; background-position: 0 92%; background-repeat: no-repeat;
    transition: background-size .25s ease, color .2s; position: relative; border-radius: 2px;
  }
  .place:hover, .place:focus-visible, .place.on { background-size: 100% 100%; outline: none; }
  .place::after {
    content: attr(data-year); position: absolute; left: 50%; bottom: calc(100% + 2px); transform: translate(-50%, 4px);
    font: 700 11px "Fredoka", sans-serif; background: var(--ink); color: #fff; border-radius: 6px; padding: 1px 6px;
    opacity: 0; transition: .2s; pointer-events: none; white-space: nowrap;
  }
  .place:hover::after, .place:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
  .words .links { margin-top: 26px; flex-wrap: nowrap; gap: 8px; }
  .words .links a { padding: 7px 12px; font-size: 14px; white-space: nowrap; text-align: center; }
  @media (max-width: 520px) {
    .words .links a { flex: 1 1 0; min-width: 0; padding: 7px 4px; font-size: 13px; }
    .words .links .arr { display: none; }
  }
  .words p.story b { color: var(--ink); }
  .resume-box {
    display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 12px 16px; max-width: 30rem;
    background: #fffaf0; border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 #0002;
    color: var(--ink); text-decoration: none; transition: transform .2s, box-shadow .2s;
  }
  .resume-box:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #0002; }
  .resume-box .doc {
    width: 38px; height: 46px; flex: none; border-radius: 4px 12px 4px 4px; background: #fff; border: 2px solid var(--ink);
    position: relative; display: grid; place-items: end center; padding-bottom: 5px; font: 800 9px "Nunito", sans-serif; color: #fff;
  }
  .resume-box .doc::before { content: ""; position: absolute; left: 6px; right: 6px; top: 8px; height: 14px; background: repeating-linear-gradient(#1f243040 0 2px, transparent 2px 5px); }
  .resume-box .doc span { background: var(--accent); border-radius: 3px; padding: 0 4px; }
  .resume-box b { display: block; font: 700 17px "Fredoka", sans-serif; }
  .resume-box small { color: #6b6355; font-size: 13px; }
  .resume-box .go { margin-left: auto; font: 700 14px "Fredoka", sans-serif; color: var(--accent); white-space: nowrap; }
  .edu { display: flex; gap: 12px; align-items: flex-start; background: #1f2430; color: #fff; border-radius: 16px; padding: 14px; margin: 4px 0 14px; }
  .edu .ico { width: 46px; height: 46px; border-radius: 12px; background: #2d3340; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1px #ffffff1a; }
  .edu .ico svg, .edu .ico img { width: 26px; height: 30px; }
  .edu b { display: block; font: 700 17px "Fredoka", sans-serif; }
  .edu small { color: #b9bdc8; font-size: 14px; line-height: 1.4; display: block; }
  .edu .when { margin-left: auto; color: #b9bdc8; font-size: 13px; white-space: nowrap; }
  .walk-in { font: 700 16px "Fredoka", sans-serif; background: none; border: 0; padding: 0; color: var(--accent); margin-top: 6px; }
  .walk-in:hover { text-decoration: underline; text-underline-offset: 4px; }

  .picture { position: relative; margin: 0; }
  .picture figcaption { display: flex; justify-content: space-between; gap: 12px; margin: 12px auto 0; width: min(480px, 100%); font: 600 14px "Fredoka", sans-serif; color: #8a7458; }
  .picture figcaption b { color: var(--ink); }

  /* ================= the evidence board ================= */
  .board {
    position: relative; width: min(480px, 100%); aspect-ratio: 4 / 5; margin: 0 auto;
    border: 14px solid #6e4a2c; border-radius: 8px; container-type: inline-size;
    box-shadow: inset 0 0 0 2px #00000030, 0 22px 40px -16px #3b2a1a99, 0 2px 0 #4d3219;
  }
  /* cork, with a window cut where the polaroid's photo is, so the live road shows through */
  .cork {
    position: absolute; inset: 0; background-color: #c99d6b;
    background-image: radial-gradient(#a8794a 0.8px, transparent 1.4px), radial-gradient(#e0bf90 0.8px, transparent 1.4px),
                      radial-gradient(ellipse at 30% 20%, #d6ad7b, transparent 60%), radial-gradient(ellipse at 80% 90%, #b88956, transparent 55%);
    background-size: 6px 6px, 9px 9px, 100% 100%, 100% 100%; background-position: 0 0, 3px 4px, 0 0, 0 0;
    box-shadow: inset 0 0 18px #00000040;
    -webkit-mask: linear-gradient(#000 0 0) 0 0 / 100% 100% no-repeat, linear-gradient(#000 0 0) var(--hx, -9px) var(--hy, -9px) / var(--hw, 1px) var(--hh, 1px) no-repeat;
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .strings { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
  .strings path { fill: none; stroke: #b3261e; stroke-width: 1.3; opacity: .55; transition: opacity .25s, stroke-width .25s; filter: drop-shadow(0 1px 1px #0005); }
  .strings path.on { opacity: 1; stroke-width: 2.4; stroke: #e0302a; }

  .item {
    position: absolute; z-index: 2; padding: 0; margin: 0; border: 0; background: none; cursor: pointer;
    transform: rotate(var(--r, 0deg)); transform-origin: 50% 0;
    transition: transform .35s cubic-bezier(.3, 1.5, .5, 1), filter .3s ease;
    filter: drop-shadow(0 3px 3px #3b2a1a55);
  }
  .item > svg { display: block; width: 100%; height: auto; overflow: visible; }
  .item:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .item.on { z-index: 4; transform: rotate(calc(var(--r, 0deg) * .3)) translateY(-1.2cqw) scale(1.05); filter: drop-shadow(0 12px 12px #3b2a1a66); }
  .board.has-focus .item:not(.on) { filter: drop-shadow(0 3px 3px #3b2a1a55) saturate(.45) brightness(.82); }
  .pin {
    position: absolute; left: 50%; top: -1.1cqw; width: 2.8cqw; height: 2.8cqw; margin-left: -1.4cqw; border-radius: 50%; z-index: 3;
    background: radial-gradient(circle at 35% 30%, #ff8a80, #d32f2f 55%, #8e1b16); box-shadow: 0 2px 2px #0006;
  }
  .item.found { animation: found 1.4s ease-in-out infinite; z-index: 3; }
  @keyframes found { 50% { filter: drop-shadow(0 0 1.6cqw #ffe14d) drop-shadow(0 8px 10px #3b2a1a66); } }

  /* per-object effects (.on = hovered here or via its chip in the intro) */
  .item[data-key="uni"].on { animation: swingId 1.3s ease-in-out; }
  @keyframes swingId { 0% { transform: rotate(3deg) scale(1.05); } 25% { transform: rotate(-9deg) scale(1.05); } 50% { transform: rotate(6deg) scale(1.05); } 75% { transform: rotate(-3deg) scale(1.05); } 100% { transform: rotate(1deg) translateY(-1.2cqw) scale(1.05); } }
  .item .curl { transform-box: fill-box; transform-origin: 100% 0; transition: transform .35s; }
  .item.on .curl { transform: scale(1.9); }
  .item .pdftag { transform-box: fill-box; transform-origin: center; transition: transform .3s; }
  .item.on .pdftag { transform: scale(1.25) rotate(-6deg); }
  .item .note2 { transform-box: fill-box; transform-origin: 0 100%; transition: transform .4s cubic-bezier(.3, 1.6, .5, 1); }
  .item.on .note2 { transform: rotate(-16deg) translate(-2px, 2px); }
  #tkIcon path:first-child { transform-box: fill-box; transform-origin: center; }
  .item.on #tkIcon path:first-child { animation: spinGear 1.1s cubic-bezier(.3, 1.3, .5, 1); }
  @keyframes spinGear { to { transform: rotate(90deg); } }
  #ghGrid .sq { transform-box: fill-box; transform-origin: center; }
  .item.on #ghGrid .sq { animation: sqPop .8s ease both; animation-delay: calc(var(--i) * 14ms); }
  @keyframes sqPop { 40% { transform: scale(1.5); fill: #26a641; } }
  .item .card2 { transform-box: fill-box; transform-origin: 0 100%; transition: transform .4s cubic-bezier(.3, 1.6, .5, 1); }
  .item.on .card2 { transform: rotate(-8deg) translate(-3px, -2px); }
  .item .cursor { animation: blink 1s steps(1) infinite; }
  .item[data-key="quant"].on { animation: flutter .7s ease-in-out; }
  @keyframes flutter { 25% { transform: rotate(-4deg) translateY(-1.2cqw) scale(1.05); } 60% { transform: rotate(9deg) translateY(-1.2cqw) scale(1.05); } }
  .item .fit { stroke-dasharray: 90; stroke-dashoffset: 0; }
  .item.on .fit { animation: drawFit 1s ease; }
  @keyframes drawFit { from { stroke-dashoffset: 90; } }
  .item #dots circle { transform-box: fill-box; transform-origin: center; }
  .item.on #dots circle { animation: dotPop .5s ease both; animation-delay: calc(var(--i) * 30ms); }
  @keyframes dotPop { from { transform: scale(0); } }
  .item .stick { transform-box: fill-box; transform-origin: 0 100%; }
  .item.on .stick { animation: clap .55s ease; }
  @keyframes clap { 30% { transform: rotate(-24deg); } 60% { transform: rotate(0); } 75% { transform: rotate(-6deg); } }
  .item .word { transform-box: fill-box; transform-origin: center; }
  .item.on .word { animation: wave .6s ease both; animation-delay: calc(var(--i) * .1s); }
  @keyframes wave { 40% { transform: translateY(-2px) rotate(-4deg); fill: #c2477a; } }
  .item .flap { transform-box: fill-box; transform-origin: 50% 0; transition: transform .35s ease; }
  .item.on .flap { transform: scaleY(-1); }
  .item .letter { transform-box: view-box; transition: transform .4s ease .1s; }
  .item.on .letter { transform: translateY(-12px); }
  .item .inbox { transform-box: fill-box; transform-origin: center; transition: transform .3s; }
  .item.on .inbox { transform: scale(1.18) rotate(-6deg); }

  /* the polaroid holding the live road */
  .polaroid {
    border: 1.8cqw solid #fffdf8; border-bottom-width: 7.5cqw; border-radius: 2px; background: transparent;
    box-shadow: 0 0 0 1px #0000000d; cursor: zoom-in;
  }
  .polaroid.on { transform: none; filter: drop-shadow(0 12px 14px #3b2a1a66); }
  .polaroid .pin { top: -3cqw; }
  .pcap {
    position: absolute; left: 0; right: 0; bottom: -6.6cqw; text-align: center; white-space: nowrap; overflow: hidden;
    font: 700 3.6cqw "Caveat", cursive; color: #4a3b2a;
  }
  .pcap b { color: var(--accent); }
  #photo {
    display: block; width: 100%; aspect-ratio: 1 / 1; margin: 0; padding: 0;
    background: transparent; border: 0; position: relative; cursor: zoom-in;
  }
  #photo:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .polaroid.on .step { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #photo .step {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.85); opacity: 0;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 99px; padding: 8px 16px;
    font: 700 16px "Fredoka", sans-serif; box-shadow: 0 3px 0 #0003; transition: .25s cubic-bezier(.3, 1.6, .5, 1); white-space: nowrap;
  }
  #photo:hover .step, #photo:focus-visible .step { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  @media (max-width: 860px) {
    .home-inner { grid-template-columns: 1fr; gap: 20px; padding: 28px 18px 48px; }
    .picture { order: -1; }
    .finder { order: -2; }
    .hero h1 { font-size: 42px; }
    .hero { margin-bottom: 0; }
    .words p.story { font-size: 18px; }
  }
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1, h2, h3, .display { font-family: "Fredoka", "Nunito", sans-serif; }

  /* ================= sky ================= */
  #sky { position: fixed; inset: 0; background: linear-gradient(#9ad4f5, #e6f6ff); }
  #sun, #moon { position: fixed; border-radius: 50%; pointer-events: none; }
  #sun { width: 76px; height: 76px; background: radial-gradient(#fff6c9, #ffd45c 60%, #ffb44a); box-shadow: 0 0 60px 20px #ffd45c88; }
  #moon { width: 52px; height: 52px; right: 14%; top: 14%; background: #f3eed8; box-shadow: 0 0 40px 10px #dfe6ff44, inset -10px -6px 0 #d9d2b8; opacity: 0; }
  #stars { position: fixed; inset: 0 0 40% 0; pointer-events: none; opacity: 0; }
  #stars i { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; animation: tw 3s infinite ease-in-out; }
  @keyframes tw { 50% { opacity: .25; } }
  .cloud { position: fixed; pointer-events: none; opacity: calc(.9 - var(--dark) * .7); }

  /* ================= parallax layers ================= */
  .layer { position: fixed; left: 0; bottom: 0; height: 100%; will-change: transform; pointer-events: none; }
  .layer svg { position: absolute; bottom: 0; left: 0; }
  #far, #near { filter: brightness(calc(1 - var(--dark) * .55)) saturate(calc(1 - var(--dark) * .3)); }

  #world { position: fixed; left: 0; bottom: 0; height: 100%; will-change: transform; }
  #world .shade { filter: brightness(calc(1 - var(--dark) * .45)); }
  .grass { position: absolute; left: 0; bottom: calc(var(--road-h) - 4px); height: 70px; background: linear-gradient(#7cc46a, #5aa457); }
  .road {
    position: absolute; left: 0; bottom: 0; height: var(--road-h);
    background:
      linear-gradient(#00000000 50%, #0000) ,
      repeating-linear-gradient(90deg, #f6e7a1 0 46px, transparent 46px 96px) center / 100% 6px no-repeat,
      linear-gradient(#5a5f6b 0 6px, #464b56 6px calc(100% - 10px), #3a3e47 calc(100% - 10px));
  }
  .curb { position: absolute; left: 0; bottom: calc(var(--road-h) - 4px); height: 8px; background: #c9c3b4; }

  /* ================= stops ================= */
  .stop { position: absolute; bottom: calc(var(--road-h) + 2px); transform: translateX(-50%); cursor: pointer; }
  .stop svg { display: block; overflow: visible; }
  .stop:hover .art, .stop.near .art { transform: translateY(-4px); }
  .art { transition: transform .25s ease; }
  .plaque {
    position: absolute; left: 50%; top: -14px; transform: translate(-50%, -100%);
    background: var(--paper); border-radius: 10px; padding: 4px 10px; white-space: nowrap;
    font: 600 14px "Fredoka", sans-serif; box-shadow: 0 3px 0 #0002; border: 2px solid var(--ink);
  }
  .plaque b { color: var(--accent); margin-right: 6px; }
  .prompt {
    position: absolute; left: 50%; top: -58px; transform: translate(-50%, -100%) scale(.6); opacity: 0;
    background: var(--ink); color: #fff; border-radius: 99px; padding: 5px 12px; font: 600 13px "Fredoka", sans-serif;
    white-space: nowrap; transition: .2s cubic-bezier(.3, 1.6, .5, 1); pointer-events: none;
  }
  .prompt kbd { background: #ffffff26; border-radius: 4px; padding: 0 5px; font: inherit; }
  .stop.near .prompt { opacity: 1; transform: translate(-50%, -100%) scale(1); }

  .win { fill: #a8cfe6; transition: fill .6s; }
  body.night .win { fill: #ffd76e; }
  body.night .glow { filter: drop-shadow(0 0 10px #ffcf5a); }
  .lamp-light { opacity: 0; transition: opacity .6s; }
  body.night .lamp-light { opacity: 1; }
  .smoke circle { animation: smoke 3.5s infinite ease-out; opacity: 0; }
  .smoke circle:nth-child(2) { animation-delay: -1.2s; }
  .smoke circle:nth-child(3) { animation-delay: -2.4s; }
  @keyframes smoke { 0% { opacity: .7; transform: translate(0, 0) scale(.6); } 100% { opacity: 0; transform: translate(14px, -46px) scale(1.6); } }
  .flag { animation: flap 1.2s infinite ease-in-out alternate; transform-origin: left center; transform-box: fill-box; }
  @keyframes flap { to { transform: skewY(-8deg) scaleX(.9); } }

  /* crossroads */
  .fork-bubble {
    position: absolute; left: 50%; bottom: 100%; margin-bottom: 70px; transform: translateX(-50%) translateY(10px);
    width: 250px; background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px;
    font-size: 14px; line-height: 1.35; opacity: 0; transition: .3s ease; pointer-events: none; box-shadow: 0 4px 0 #0002;
  }
  .fork-bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; background: var(--paper); border: 2px solid var(--ink); border-top: 0; border-left: 0; transform: translateX(-50%) rotate(45deg); }
  .stop.near .fork-bubble { opacity: 1; transform: translateX(-50%); }
  .stop.fork.near .plaque, .stop.fork .prompt { display: none; }
  .took { color: var(--chosen); font-weight: 800; }
  .skip { color: var(--ghost); text-decoration: line-through; }

  /* ================= player ================= */
  #player { position: absolute; bottom: 34px; width: 46px; height: 78px; margin-left: -23px; transform-origin: bottom center; z-index: 5; }
  #player .body { transform-origin: 50% 100%; }
  #player .leg { transform-origin: 50% 0; transform-box: fill-box; }
  #player .arm { transform-origin: 50% 0; transform-box: fill-box; }
  #player.walking .leg.l, #player.walking .arm.r { animation: swing .42s infinite ease-in-out alternate; }
  #player.walking .leg.r, #player.walking .arm.l { animation: swing .42s infinite ease-in-out alternate-reverse; }
  #player.walking .body { animation: bob .21s infinite ease-in-out alternate; }
  @keyframes swing { from { transform: rotate(28deg); } to { transform: rotate(-28deg); } }
  @keyframes bob { to { transform: translateY(-2px); } }
  #player .shadow { fill: #0003; }
  /* outfits by life stage */
  #player { --skin: #f1c7a0; --shoe: #2b2b30; }
  #player[data-era="kid"]  { --shirt: #ffd166; --pants: #3f6fb8; --leg: var(--skin); --sleeve: var(--skin); --bag: #e2574c; --shoe: #e2574c; }
  #player[data-era="teen"] { --shirt: #ffffff; --pants: #2e4a6b; --leg: var(--pants); --sleeve: #ffffff; --bag: #3a3d44; }
  #player[data-era="uni"]  { --shirt: #ff7a59; --pants: #2f3b5c; --leg: var(--pants); --sleeve: #ff7a59; --bag: #3f6fb8; }
  #player[data-era="pro"]  { --shirt: #1f2a44; --pants: #1f2a44; --leg: var(--pants); --sleeve: #1f2a44; --shoe: #120d0a; }
  #player .shirt { fill: var(--shirt); transition: fill .4s; }
  #player .legc { fill: var(--leg); } #player .shorts { fill: var(--pants); }
  #player .sleeve { fill: var(--sleeve); } #player .skin { fill: var(--skin); }
  #player .bag { fill: var(--bag); } #player .shoe { fill: var(--shoe); }
  #player .kid, #player .teen, #player .uni, #player .pro { display: none; }
  #player[data-era="kid"] .kid, #player[data-era="teen"] .teen, #player[data-era="uni"] .uni, #player[data-era="pro"] .pro { display: inline; }
  #player[data-era="pro"] .bag { display: none; }
  #player[data-era="teen"] .shirt { stroke: #d6dbe4; stroke-width: .8; }

  /* ================= HUD ================= */
  .hud-top {
    position: fixed; top: 0; left: 0; right: 0; padding: 16px 22px; display: flex; gap: 22px; align-items: center; z-index: 20;
    pointer-events: none;
  }
  .hud-top > * { pointer-events: auto; }
  .brand { font: 700 20px "Fredoka", sans-serif; color: var(--ink); background: var(--paper); padding: 6px 14px; border-radius: 99px; border: 2px solid var(--ink); white-space: nowrap; box-shadow: 0 3px 0 #0002; }
  .brand span { color: var(--accent); }
  #timeline { flex: 1; position: relative; height: 44px; max-width: 900px; margin: 0 auto; }
  #timeline .track { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 9px; background: #ffffffaa; border: 2px solid var(--ink); box-sizing: content-box; }
  #timeline .fill { position: absolute; left: 0; top: 16px; height: 6px; border-radius: 9px; background: var(--accent); width: 0; }
  #timeline button {
    position: absolute; top: 9px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; padding: 0;
    background: var(--paper); border: 2px solid var(--ink); transition: transform .15s, background .2s;
  }
  #timeline button.fork { border-radius: 4px; transform: rotate(45deg) scale(.85); }
  #timeline button.done { background: var(--accent); }
  #timeline button:hover { transform: scale(1.3); }
  #timeline button.fork:hover { transform: rotate(45deg) scale(1.15); }
  #timeline button span {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font: 600 11px "Fredoka", sans-serif; color: var(--ink);
    background: #fffaf0d0; padding: 0 4px; border-radius: 4px; white-space: nowrap;
  }
  #timeline button.fork span { transform: translateX(-50%) rotate(-45deg); top: 18px; left: 18px; }
  #timeline .you { position: absolute; top: 2px; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); display: grid; place-items: center; font-size: 15px; pointer-events: none; transition: left .05s linear; }

  .hud-btn { background: var(--paper); border: 2px solid var(--ink); border-radius: 99px; padding: 6px 14px; font: 600 15px "Fredoka", sans-serif; box-shadow: 0 3px 0 #0002; white-space: nowrap; }
  .hud-btn:hover { background: #fff; }
  .hud-btn:active { transform: translateY(2px); box-shadow: none; }

  .hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 20; color: #fff; font: 600 14px "Fredoka", sans-serif;
    background: #1f2430b0; padding: 6px 14px; border-radius: 99px; white-space: nowrap; transition: opacity .5s;
  }
  .hint kbd { background: #ffffff2a; border-radius: 4px; padding: 0 6px; font: inherit; }
  .pad { position: fixed; bottom: 20px; z-index: 21; width: 62px; height: 62px; border-radius: 50%; border: 2px solid var(--ink); background: #fffaf0e6; font-size: 26px; display: none; box-shadow: 0 3px 0 #0003; }
  .pad.l { left: 16px; } .pad.r { right: 16px; }
  @media (hover: none) { .pad { display: block; } .hint .keys { display: none; } }

  /* ================= intro card ================= */
  #intro {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px;
    background: radial-gradient(ellipse at center, #1f243055, #1f2430aa); transition: opacity .5s;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  .card {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 #0003;
    padding: 30px 32px; max-width: 470px; text-align: center;
  }
  .card h1 { font-size: 40px; margin: 0 0 4px; line-height: 1.05; }
  .card h1 span { color: var(--accent); }
  .card p { margin: 10px 0 22px; font-size: 17px; line-height: 1.5; }
  .card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .big { font: 700 17px "Fredoka", sans-serif; border: 2px solid var(--ink); border-radius: 14px; padding: 11px 20px; background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--ink); }
  .big.alt { background: #fff; color: var(--ink); }
  .big:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

  /* ================= panel ================= */
  dialog { border: 0; padding: 0; background: transparent; max-width: min(600px, calc(100vw - 24px)); width: 100%; }
  dialog::backdrop { background: #1f243077; backdrop-filter: blur(2px); }
  dialog[open] .sheet { animation: pop .35s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes pop { from { transform: translateY(24px) scale(.95); opacity: 0; } }
  .sheet {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 #0003;
    padding: 24px 26px 26px; max-height: calc(100vh - 40px); overflow: auto; user-select: text; -webkit-user-select: text;
  }
  .sheet header { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
  .sheet .icon { font-size: 34px; line-height: 1; }
  .sheet h2 { margin: 0; font-size: 28px; line-height: 1.1; }
  .sheet .when { margin: 2px 0 0; color: var(--accent); font: 600 14px "Fredoka", sans-serif; }
  .x { margin-left: auto; background: #1f24300f; border: 0; border-radius: 50%; width: 34px; height: 34px; flex: none; font-size: 16px; }
  .x:hover { background: #1f243022; }
  .sheet p { line-height: 1.6; margin: 0 0 12px; }
  .sheet ul.cards { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .sheet ul.cards li { border: 2px solid #1f243022; border-radius: 14px; padding: 12px 14px; }
  .sheet ul.cards b { font-family: "Fredoka", sans-serif; font-size: 17px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 800; background: #1f24300f; border-radius: 99px; padding: 2px 9px; margin: 6px 4px 0 0; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .choice { border: 2px solid var(--chosen); border-radius: 16px; padding: 14px; background: #2fa36b12; }
  .choice.not { border: 2px dashed var(--ghost); background: transparent; color: #5c6173; }
  .choice small { display: block; font: 700 12px "Fredoka", sans-serif; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; color: var(--chosen); }
  .choice.not small { color: var(--ghost); }
  .choice b { font-family: "Fredoka", sans-serif; font-size: 19px; }
  .nav-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 16px; }
  .links a { text-decoration: none; color: var(--ink); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 14px; font: 600 15px "Fredoka", sans-serif; box-shadow: 0 3px 0 #0002; background: #fff; }
  .links a:hover { background: #ffe6dc; }
  form.note { display: grid; gap: 8px; }
  form.note input, form.note textarea { font: inherit; border: 2px solid #1f243033; border-radius: 12px; padding: 10px 12px; background: #fff; resize: vertical; }
  form.note input:focus, form.note textarea:focus { outline: none; border-color: var(--accent); }

  @media (max-width: 720px) {
    :root { --road-h: 96px; }
    .hud-top { flex-wrap: wrap; padding: 10px 12px; gap: 10px; }
    .brand { font-size: 16px; }
    #timeline { order: 3; flex-basis: 100%; }
    #timeline button span { display: none; }
    .choices { grid-template-columns: 1fr; }
    .card h1 { font-size: 32px; }
  }
  /* ================= university chip + lanyard ID card ================= */
  .uni-chip {
    --u: #2b4c9b;
    display: inline-flex; align-items: center; gap: 6px; vertical-align: -2px;
    font: inherit; font-weight: 800; line-height: 1.3; color: #fff; background: var(--u);
    border: 0; border-radius: 7px; padding: 1px 9px 1px 6px; cursor: pointer;
    box-shadow: 0 2px 0 color-mix(in srgb, var(--u) 60%, #000); transition: transform .2s, box-shadow .2s;
  }
  .uni-chip:hover, .uni-chip:focus-visible { transform: translateY(-2px) rotate(-1.5deg); box-shadow: 0 4px 0 color-mix(in srgb, var(--u) 60%, #000); outline: none; }
  .uni-chip img, .uni-chip svg { width: 1.05em; height: 1.05em; object-fit: contain; flex: none; }
  a.uni-chip { text-decoration: none; }
  /* ================= "Off the clock" under the intro ================= */
  .offclock { margin-top: 30px; padding-top: 20px; border-top: 2px dashed #1f24301f; }
  .oc-label { font: 700 13px "Fredoka", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
  .oc-text { font-size: 18px; line-height: 1.7; color: #3a3f4c; margin: 0 0 14px; }
  .song-card {
    display: flex; align-items: center; gap: 14px; width: 100%; max-width: 30rem; text-align: left; cursor: pointer;
    background: #fffaf0; border: 2px solid var(--ink); border-radius: 16px; padding: 12px 16px; box-shadow: 0 3px 0 #0002;
    transition: transform .2s, box-shadow .2s;
  }
  .song-card:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #0002; }
  .song-disc {
    width: 44px; height: 44px; border-radius: 50%; flex: none; animation: spin 2.6s linear infinite paused;
    background: radial-gradient(circle, #3f6fb8 0 18%, #111 19% 22%, #222 23% 40%, #111 41% 43%, #2a2a2a 44% 70%, #111 71%);
  }
  .song-card.playing .song-disc { animation-play-state: running; }
  .song-meta { flex: 1; min-width: 0; line-height: 1.25; }
  .song-meta small { display: block; font: 700 11px "Fredoka", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8a8478; }
  .song-meta b { display: block; font: 700 17px "Fredoka", sans-serif; }
  .song-meta span { color: #6b6355; font-size: 14px; }
  .song-go { font: 700 14px "Fredoka", sans-serif; color: var(--accent); white-space: nowrap; }
  #songSlot .now-playing { max-width: 30rem; margin-top: 10px; }
  .writing { margin-top: 26px; padding-top: 20px; border-top: 2px dashed #1f24301f; }
  .blog { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; max-width: 30rem; }
  .blog a { display: block; text-decoration: none; color: var(--ink); background: #fffaf0; border: 1.5px solid #1f243026; border-radius: 12px; padding: 10px 14px; }
  .blog a:hover { border-color: var(--accent); }
  .blog b { font: 700 16px "Fredoka", sans-serif; margin-right: 8px; }
  .blog small { color: #8a8478; }
  .blog span { display: block; font-size: 14px; color: #5c6173; margin-top: 2px; }

  /* ================= the shelf: record player + monitor ================= */
  .shelf {
    position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 14px;
    width: min(480px, 100%); margin: 26px auto 18px; padding: 0 6px;
  }
  .shelf::after {
    content: ""; position: absolute; left: -8px; right: -8px; bottom: -12px; height: 12px; border-radius: 3px;
    background: linear-gradient(#8a5d3b, #6e4a2c); box-shadow: 0 8px 12px -6px #3b2a1a99;
  }
  .deck {
    flex: 1 1 200px; max-width: 236px; padding: 0; border: 0; background: none; cursor: pointer;
    filter: drop-shadow(0 6px 8px #3b2a1a55); transition: transform .3s cubic-bezier(.3, 1.5, .5, 1), filter .3s;
  }
  .deck svg { display: block; width: 100%; height: auto; }
  .deck:hover, .deck:focus-visible { transform: translateY(-3px); filter: drop-shadow(0 10px 12px #3b2a1a66); outline: none; }
  .deck .platter { transform-box: fill-box; transform-origin: center; animation: spin 2.2s linear infinite; animation-play-state: paused; }
  .deck.playing .platter { animation-play-state: running; }
  .deck .arm { transform-box: view-box; transform-origin: 254px 46px; transition: transform .8s cubic-bezier(.4, 1.3, .5, 1); }
  .deck.playing .arm { transform: rotate(24deg); }
  .deck .led { transition: fill .3s; }
  .deck.playing .led { fill: #3ddc84; }
  /* the "music" chip: plays / pauses the record; little equaliser bars while it plays */
  .music-chip .eq { display: none; gap: 2px; align-items: flex-end; height: .8em; margin-left: 2px; }
  .music-chip .eq i { width: 3px; height: 30%; background: #fff; border-radius: 1px; animation: chipEq .7s ease-in-out infinite alternate; }
  .music-chip .eq i:nth-child(2) { animation-delay: -.25s; } .music-chip .eq i:nth-child(3) { animation-delay: -.5s; }
  .music-chip.on-air .eq { display: inline-flex; }
  .music-chip.on-air { box-shadow: 0 2px 0 color-mix(in srgb, var(--u) 60%, #000), 0 0 0 4px color-mix(in srgb, var(--u) 28%, transparent); }
  @keyframes chipEq { from { height: 25%; } to { height: 100%; } }

  /* taped "now playing" card beside the record player */
  .np-card {
    position: relative; flex: 1 1 190px; max-width: 220px; align-self: center; background: #24252a; color: #e9eaee;
    border-radius: 8px; padding: 18px 16px 14px; transform: rotate(1.5deg); box-shadow: 0 14px 22px -12px #000a;
    font: 400 13px "Nunito", sans-serif;
  }
  .np-card::before, .np-card::after { content: ""; position: absolute; top: -9px; width: 54px; height: 18px; background: #d9d6cc8c; }
  .np-card::before { left: 12px; transform: rotate(-5deg); } .np-card::after { right: 12px; transform: rotate(4deg); }
  .np-card p { margin: 0; }
  .np-kicker { display: flex; align-items: center; gap: 7px; font: 700 10.5px "Fredoka", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #a9abb3; }
  .np-kicker .dot { width: 7px; height: 7px; border-radius: 50%; background: #c0392b; transition: .3s; }
  .np-card.on .np-kicker .dot { background: #3ddc84; box-shadow: 0 0 6px #3ddc84; }
  .np-kicker .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
  .np-kicker .bars i { width: 2px; height: 3px; background: #a9abb3; border-radius: 1px; }
  .np-card.on .np-kicker .bars i { animation: eq .8s ease-in-out infinite alternate; background: #3ddc84; }
  .np-card.on .np-kicker .bars i:nth-child(2) { animation-delay: -.3s; } .np-card.on .np-kicker .bars i:nth-child(3) { animation-delay: -.55s; }
  @keyframes eq { from { height: 3px; } to { height: 10px; } }
  .np-song { margin: 8px 0 3px !important; line-height: 1.3; }
  .np-song b { font: 700 16px "Fredoka", sans-serif; color: #fff; }
  .np-song span { color: #a9abb3; }
  .np-song span::before { content: "— "; }
  .np-album { color: #8e919a; font-size: 12px; line-height: 1.35; }
  .np-link { display: inline-block; margin-top: 10px; font: 700 12px "Fredoka", sans-serif; color: #ff9d82; text-decoration: none; }
  .np-link:hover { text-decoration: underline; }
  .np-note { margin-top: 6px !important; font-size: 10.5px; color: #6f727c; }
  .sound-btn { background: none; border: 0; padding: 0; font: 600 13px "Fredoka", sans-serif; color: #8a7458; cursor: pointer; white-space: nowrap; }
  .sound-btn:hover { color: var(--ink); }
  .now-playing { background: #1f2430; color: #fff; border-radius: 16px; padding: 14px; margin-top: 6px; }
  .np-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .np-head small { display: block; font: 700 11px "Fredoka", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #ff9d82; }
  .np-head b { display: block; font: 700 18px "Fredoka", sans-serif; }
  .np-head span span { color: #b9bdc8; font-size: 14px; }
  .vinyl {
    width: 46px; height: 46px; border-radius: 50%; flex: none; animation: spin 3s linear infinite;
    background: radial-gradient(circle, #ff7a59 0 18%, #111 19% 22%, #222 23% 40%, #111 41% 43%, #2a2a2a 44% 70%, #111 71%);
    box-shadow: 0 0 0 2px #ffffff22;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .np-video { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
  .np-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .uni-chip img.chip-logo { background: none; padding: 0; border-radius: 3px; box-shadow: 0 0 0 1.5px #fff; }
  .uni-chip.on { transform: translateY(-2px) rotate(-1.5deg); box-shadow: 0 4px 0 color-mix(in srgb, var(--u) 60%, #000), 0 0 0 3px color-mix(in srgb, var(--u) 30%, transparent); }

  /* ================= recruiter search ================= */
  .finder { position: relative; grid-column: 1 / -1; z-index: 5; }
  .finder-lead { font-size: 15.5px; line-height: 1.5; color: #6b6355; margin: 0 0 10px; }
  .finder-box input { font-size: 17px !important; padding: 15px 0 !important; }
  .finder-box { border-radius: 16px; }
  .hit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; align-items: start; }
  .hit-grid .hit { margin-bottom: 0; }
  .finder-lead b { color: var(--ink); }
  .finder-box {
    display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--ink); border-radius: 14px;
    padding: 0 12px; box-shadow: 0 3px 0 #0002; transition: box-shadow .2s, border-color .2s; cursor: text;
  }
  .finder-box:focus-within { border-color: var(--accent); box-shadow: 0 3px 0 #0002, 0 0 0 4px #ff7a5933; }
  .finder-box svg { width: 19px; height: 19px; color: #8a8478; flex: none; }
  .finder-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 600 15px "Nunito", sans-serif; color: var(--ink); padding: 13px 0; }
  .finder-box input::placeholder { color: #9c968a; font-weight: 400; }
  .finder-box kbd { font: 700 12px "Fredoka", sans-serif; border: 1.5px solid #1f243040; border-radius: 6px; padding: 1px 7px; color: #8a8478; }
  .finder-try { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; font-size: 13px; color: #8a8478; align-items: center; }
  .finder-try button { font: 700 12.5px "Nunito", sans-serif; border: 1.5px solid #1f243026; background: #fffaf0; border-radius: 99px; padding: 3px 10px; color: #4a4f5c; }
  .finder-try button:hover { border-color: var(--accent); color: var(--accent); }
  .finder-results {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30; background: #fffaf0; border: 2px solid var(--ink);
    border-radius: 16px; box-shadow: 0 18px 40px -12px #3b2a1a66; max-height: min(62vh, 560px); overflow-y: auto; padding: 14px;
    user-select: text; -webkit-user-select: text;
  }
  .finder-results[hidden] { display: none; }
  .verdict { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; margin-bottom: 12px; font-size: 14.5px; line-height: 1.45; }
  .verdict.yes { background: #2fa36b17; color: #1d6b45; }
  .verdict.some { background: #3f6fb814; color: #2b4c7a; }
  .verdict.no { background: #1f24300d; color: #4a4f5c; }
  .verdict .mark { font-size: 18px; line-height: 1.2; }
  .verdict a { color: inherit; font-weight: 800; }
  .hit { border: 1.5px solid #1f24301f; border-radius: 12px; padding: 11px 13px; margin-bottom: 9px; background: #fff; }
  .hit-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; }
  .hit .sec { font: 700 11px "Fredoka", sans-serif; letter-spacing: .05em; text-transform: uppercase; color: #fff; background: var(--c); border-radius: 5px; padding: 1px 7px; }
  .hit-top b { font: 700 15.5px "Fredoka", sans-serif; }
  .hit-top small { color: #8a8478; font-size: 12.5px; }
  .hit .role { font-size: 13px; font-style: italic; color: #5c6173; margin-top: 2px; }
  .hit-tags { margin-top: 6px; }
  .hit-tags .chip { font-size: 11.5px; }
  .hit-tags .chip.hitag { background: #ffe08a; }
  .hit ul { margin: 7px 0 0; padding-left: 18px; font-size: 13.5px; line-height: 1.5; color: #3a3f4c; }
  .hit li { margin: 3px 0; }
  .hit mark { background: #ffe08a; color: inherit; border-radius: 3px; padding: 0 2px; }
  .hit-act { display: flex; gap: 12px; margin-top: 8px; font: 700 13px "Fredoka", sans-serif; }
  .hit-act button, .hit-act a { background: none; border: 0; padding: 0; color: var(--c); text-decoration: underline; text-underline-offset: 3px; font: inherit; }
  .group-label { font: 700 12px "Fredoka", sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #8a8478; margin: 12px 2px 6px; }
  .words p.story { margin-bottom: 14px; font-size: 18.5px; line-height: 1.78; }
  .words p.story .uni-chip { margin: 2px 1px; }
  /* bullet lists inside chip panels */
  .sheet ul.pts { margin: 6px 0 2px; padding-left: 18px; }
  .sheet ul.pts li { border: 0; padding: 0; margin: 3px 0; font-size: 14.5px; line-height: 1.5; }
  .sheet ul.cards li small { color: #6b6355; }
  .sheet a.more { display: inline-block; margin-top: 4px; font: 700 14px "Fredoka", sans-serif; color: var(--ink); }
  .uni-chip img { background: #fff; border-radius: 3px; padding: 1px; }

  #badgeWrap { position: fixed; inset: 0; z-index: 60; display: none; background: #1f243070; backdrop-filter: blur(4px); perspective: 1100px; }
  #badgeWrap.open { display: block; }
  .hang { position: absolute; left: 50%; top: 0; width: 300px; margin-left: -150px; transform-origin: 50% 0; }
  #badgeWrap.open .hang { animation: drop .95s cubic-bezier(.25, 1.45, .45, 1) both, sway 3.4s ease-in-out .95s infinite alternate; }
  #badgeWrap.closing .hang { animation: lift .4s cubic-bezier(.6, 0, .9, .4) forwards; }
  @keyframes drop { from { transform: translateY(-110vh) rotate(-6deg); } }
  @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
  @keyframes lift { to { transform: translateY(-110vh) rotate(4deg); } }
  .strap {
    width: 28px; margin: 0 auto; height: max(18px, calc(50vh - 330px));
    background: repeating-linear-gradient(0deg, var(--u, #2b4c9b) 0 18px, color-mix(in srgb, var(--u, #2b4c9b) 82%, #fff) 18px 20px);
    box-shadow: inset 0 0 0 2px #0002;
  }
  .clip { width: 20px; height: 26px; margin: -2px auto 0; border: 4px solid #9aa1ad; border-top: 0; border-radius: 0 0 10px 10px; position: relative; }
  .clip::before { content: ""; position: absolute; left: 50%; top: -6px; width: 30px; height: 10px; margin-left: -15px; background: #b9bfc9; border-radius: 3px; }
  .idcard {
    position: relative; width: 300px; margin-top: -6px; border-radius: 18px; overflow: hidden;
    background: #fbfbfd; color: var(--ink); box-shadow: 0 30px 60px -18px #000a, 0 0 0 1px #0001;
    transform-style: preserve-3d; transition: transform .15s ease-out; cursor: grab;
  }
  .idcard { font-family: "Nunito", system-ui, sans-serif; border-radius: 20px; background: #f4f5f7; }
  .idcard .slot { position: absolute; left: 50%; top: 12px; width: 44px; height: 9px; margin-left: -22px; border-radius: 9px; background: #00000030; z-index: 5; }
  .idcard .top { height: 190px; position: relative; background: #dfe2e8; overflow: hidden; }
  /* the big holographic "M" monogram beside the photo */
  .idcard .mono { position: absolute; left: 0; top: 0; width: 140px; height: 190px; }
  .idcard .mono .shine { animation: monoShine 6s ease-in-out infinite; }
  @keyframes monoShine { 0%, 100% { transform: translateY(-30px); } 50% { transform: translateY(30px); } }
  .idcard .photo {
    position: absolute; left: 116px; top: 26px; width: 140px; height: 140px; border-radius: 50%; overflow: hidden;
    border: 5px solid #f4f5f7; background: linear-gradient(135deg, #ffd9c2, #f3a98c); display: grid; place-items: center;
    font: 700 54px "Fredoka", sans-serif; color: #fff; box-shadow: 0 6px 16px #0002; z-index: 2;
  }
  .idcard .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; background: #fff; }
  .idcard .body { padding: 16px 22px 20px; background: #f4f5f7; }
  .idcard .uni { display: flex; align-items: center; gap: 7px; margin-bottom: 16px; }
  .idcard .uni img, .idcard .uni svg { width: 34px; height: 40px; object-fit: contain; flex: none; }
  /* Monash-style wordmark: tall uppercase MONASH over a light "University" */
  .idcard .wordmark { line-height: 1; color: #111318; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .idcard .wordmark b { display: block; font-weight: 400; font-size: 23px; letter-spacing: .01em; transform: scaleY(1.06); transform-origin: bottom left; }
  .idcard .wordmark span { display: block; font-weight: 300; font-size: 21px; letter-spacing: -.01em; margin-top: -1px; }
  .idcard .bars { display: block; width: 100%; height: 34px; margin-bottom: 14px; }
  .idcard h3 { font: 800 21px "Nunito", sans-serif; margin: 0 0 6px; line-height: 1.1; }
  .idcard .deg { font-size: 13.5px; margin: 0; color: #1f2430; line-height: 1.35; }
  .idcard .fac { color: #6b7080; font-size: 12.5px; margin: 3px 0 12px; }
  .idcard .foot { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed #1f243026; padding-top: 10px; font-size: 12.5px; color: #6b7080; }
  .idcard .foot b { color: var(--ink); font-size: 15px; }
  .idcard .holo {
    position: absolute; inset: 0 0 auto 0; height: 190px; pointer-events: none; mix-blend-mode: soft-light; opacity: .55; z-index: 4;
    background: linear-gradient(115deg, transparent 20%, #ff8ad8 32%, #8af0ff 42%, #fff6a0 52%, #a8ff9c 60%, transparent 74%);
    background-size: 260% 260%; background-position: var(--hx, 50%) var(--hy, 50%);
  }
  /* hovering the student card: lift, glare under the cursor, foil sweep, photo zoom, lanyard holds still */
  .idcard { transition: transform .18s ease-out, box-shadow .3s ease; }
  .idcard:hover { box-shadow: 0 44px 80px -20px #000c, 0 0 0 2px #ffffffb0, 0 0 42px #7fb2ff66; }
  .hang:has(.idcard:hover) { animation-play-state: paused; }
  .idcard .holo { transition: height .35s ease, opacity .35s ease; }
  .idcard:hover .holo { height: 100%; opacity: .75; }
  .idcard .glare {
    position: absolute; inset: 0; pointer-events: none; z-index: 5; opacity: 0; transition: opacity .3s;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), #ffffffb3 0, #ffffff40 18%, #ffffff00 45%);
    mix-blend-mode: soft-light;
  }
  .idcard:hover .glare { opacity: 1; }
  .idcard .sweep {
    position: absolute; inset: -20% auto -20% -60%; width: 45%; pointer-events: none; z-index: 5; opacity: 0;
    background: linear-gradient(100deg, transparent, #ffffff99 45%, #c9f3ff88 55%, transparent);
    transform: skewX(-18deg);
  }
  .idcard:hover .sweep { animation: sweep 1.1s ease-out; }
  @keyframes sweep { 0% { left: -60%; opacity: 0; } 15% { opacity: 1; } 100% { left: 130%; opacity: 0; } }
  .idcard .photo img { transition: transform .4s ease; }
  .idcard:hover .photo img { transform: scale(1.08); }
  .idcard:hover .photo { box-shadow: 0 8px 22px #0003, 0 0 0 3px #7fb2ff55; }
  .idcard .mono path:first-of-type { transition: filter .35s; }
  .idcard:hover .mono path:first-of-type { filter: saturate(1.5) brightness(1.05); }

  /* sticky note taped under the card */
  .sticky {
    position: relative; width: 400px; margin: -12px 0 0 -50px; z-index: 6; padding: 22px 20px 18px;
    background: linear-gradient(180deg, #fff4a8, #ffe97a); color: #3b3320;
    box-shadow: 0 14px 22px -10px #0007, inset 0 -10px 18px -12px #c9a8264d;
    transform: rotate(-2.5deg); border-radius: 2px 2px 14px 2px;
  }
  #badgeWrap.open .sticky { animation: stick .5s cubic-bezier(.3, 1.6, .5, 1) .75s both; }
  @keyframes stick { from { transform: rotate(-12deg) translateY(30px) scale(.8); opacity: 0; } }
  .sticky::before, .sticky::after {
    content: ""; position: absolute; top: -10px; width: 74px; height: 22px; background: #ffffff8c;
    box-shadow: 0 1px 2px #0002; backdrop-filter: blur(1px);
  }
  .sticky::before { left: 14px; transform: rotate(-6deg); }
  .sticky::after { right: 14px; transform: rotate(5deg); }
  /* dark taped note with a single education line: tile · name + course · dates */
  .sticky {
    background: #24252a; color: #f2f2f4; border-radius: 6px; transform: rotate(-1.2deg);
    box-shadow: 0 18px 30px -12px #000a, inset 0 0 0 1px #ffffff12;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  .sticky::before, .sticky::after { background: #d9d6cc8c; top: -11px; }
  .sticky .edu-line { display: flex; gap: 14px; align-items: flex-start; }
  .sticky .tile {
    width: 46px; height: 46px; flex: none; border-radius: 12px; background: #34363d; display: grid; place-items: center;
    box-shadow: inset 0 0 0 1px #ffffff1c;
  }
  .sticky .tile img, .sticky .tile svg { width: 26px; height: 30px; object-fit: contain; }
  .sticky .what { flex: 1; min-width: 0; }
  .sticky .what b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .sticky .what small { display: block; font-size: 14px; line-height: 1.4; color: #a9abb3; margin-top: 2px; }
  .sticky .dates { font-size: 14px; color: #a9abb3; white-space: nowrap; padding-top: 2px; }
  .hang-in { transform: scale(var(--fit, 1)); transform-origin: 50% 0; }
  .badge-hint { top: 18px; bottom: auto !important; }
  .badge-hint { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); color: #fff; font: 600 14px "Fredoka", sans-serif; opacity: .85; white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>

// Line icon: gear outline with an open-end wrench across it (24×24 box).
// `col` = line colour, `bg` = the colour behind it (used to cut a clean gap where the wrench crosses the gear).
function gearIcon(col, bg, w = 1.6) {
  const n = 8, ro = 10.4, ri = 8.2, step = Math.PI * 2 / n;
  const pt = (r, a) => `${(12 + r * Math.cos(a)).toFixed(2)} ${(12 + r * Math.sin(a)).toFixed(2)}`;
  let gear = "";
  for (let i = 0; i < n; i++) {
    const a = i * step - Math.PI / 2;
    gear += `${i ? "L" : "M"}${pt(ri, a - .32 * step)} L${pt(ro, a - .19 * step)} L${pt(ro, a + .19 * step)} L${pt(ri, a + .32 * step)} `;
  }
  // wrench drawn lying flat (round head with a jaw opening on the left, handle to the right), then turned 45°

  return `<g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="${gear}Z" stroke="${col}" stroke-width="${w}"/>
    <path d="${wrench}" transform="translate(10.3 10.3) rotate(45)" stroke="${bg}" stroke-width="${w * 3.2}"/>
    <path d="${wrench}" transform="translate(10.3 10.3) rotate(45)" stroke="${col}" stroke-width="${w}" fill="${bg}"/>
  </g>`;
}

/* --- parallax scenery ---------------------------------------------- */
function ridge(width, height, base, amp, step, color, extra = "") {
  let d = `M0 ${height}`;
  for (let x = 0; x <= width; x += step) d += ` L${x} ${base - rnd() * amp}`;
  d += ` L${width} ${height} Z`;
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><path d="${d}" fill="${color}"/>${extra}</svg>`;
}
function buildScenery() {
  const h = innerHeight;
  far.innerHTML = ridge(WORLD_W * .25 + innerWidth, h, h - 230, 160, 140, "#9bb6d6");
  near.innerHTML = ridge(WORLD_W * .55 + innerWidth, h, h - 170, 70, 60, "#88c08a");
  // stars
  const stars = $("#stars"); stars.innerHTML = "";
  for (let i = 0; i < 90; i++) stars.insertAdjacentHTML("beforeend", `<i style="left:${rnd() * 100}%;top:${rnd() * 100}%;animation-delay:${-rnd() * 3}s;opacity:${.4 + rnd() * .6}"></i>`);
  // clouds
  const clouds = $("#clouds"); clouds.innerHTML = "";
  for (let i = 0; i < 6; i++) {
    const w = 90 + rnd() * 90;
    clouds.insertAdjacentHTML("beforeend", `<svg class="cloud" data-speed="${.05 + rnd() * .08}" data-x="${rnd() * 1.6}" style="top:${8 + rnd() * 26}%" width="${w}" height="${w * .45}" viewBox="0 0 100 45">
      <circle cx="30" cy="28" r="16" fill="#fff"/><circle cx="52" cy="20" r="20" fill="#fff"/><circle cx="74" cy="28" r="15" fill="#fff"/><rect x="18" y="28" width="66" height="16" rx="8" fill="#fff"/></svg>`);
  }
}

/* --- sky colours across a lifetime: dawn → noon → golden hour → night --- */
const SKY = [
  [0.00, "#ffb98a", "#ffe7c7"],
  [0.18, "#7fc3ef", "#d9f1ff"],
  [0.50, "#5aa8e6", "#cfeaff"],
  [0.72, "#f08a5d", "#ffd49a"],
  [0.84, "#4b3a7a", "#f0937a"],
  [1.00, "#0d1330", "#2c3566"],
];
const hex = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => "rgb(" + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t)).join(",") + ")";
function skyAt(p) {
  for (let i = 1; i < SKY.length; i++) if (p <= SKY[i][0]) {
    const [p0, t0, b0] = SKY[i - 1], [p1, t1, b1] = SKY[i], t = (p - p0) / (p1 - p0);
    return [mix(t0, t1, t), mix(b0, b1, t)];
  }
  return [SKY.at(-1)[1], SKY.at(-1)[2]];
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

/* --- movement ------------------------------------------------------- */
let px = PLAYER_START, cam = 0, keys = {}, target = null, openOnArrive = null, facing = 1, last = performance.now();
let touchDir = 0, tour = null, nearIdx = -1, started = false;
const player = () => $("#player");

function walkTo(i, open) {
  const s = STOPS[i];
  target = s.x + (s.type === "fork" ? 0 : 0);
  openOnArrive = open ? i : null;
  stopTour();
  if (Math.abs(target - px) < 8) { target = null; if (open) openStop(i); }
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0) || touchDir;
  if (dir) { target = null; openOnArrive = null; }
  const speed = mode === "home" ? 1500 : keys.fast ? 720 : tour ? 300 : 360;
  if (!dir && target !== null) {
    const d = target - px;
    if (Math.abs(d) < 6) {
      px = target; target = null;
      if (openOnArrive !== null) { const i = openOnArrive; openOnArrive = null; openStop(i); }
      if (tour) tour.arrived();
    } else dir = Math.sign(d);
  }
  if (dialogOpen()) dir = 0;
  px = Math.min(LAST_X + 260, Math.max(90, px + dir * speed * dt));
  if (dir) facing = dir;

  const vw = innerWidth;
  const want = Math.min(WORLD_W - vw, Math.max(0, px - vw * (mode === "game" ? .38 : .5)));
  cam += (want - cam) * Math.min(1, dt * 8);
  world.style.transform = `translateX(${-cam}px)`;
  far.style.transform = `translateX(${-cam * .25}px)`;
  near.style.transform = `translateX(${-cam * .55}px)`;

  const p = pOf(px);
  const pl = player();
  const grow = .72 + .28 * Math.min(1, p * 1.8);   // you grow up as you walk
  pl.style.left = px + "px";
  pl.style.transform = `scale(${facing * grow}, ${grow})`;
  // outfit for this part of life: kid → school uniform → uni → intern in a suit
  // outfits change when you arrive at a building, never at a crossroad
  const at = (find) => STOPS.find(find).x - 30;
  const era = px < at(s => s.art === "secondary") ? "kid"      // primary school and before
            : px < at(s => s.art === "college") ? "teen"        // from the secondary school building (incl. the 2021 crossroad)
            : px < at(s => s.art === "office") ? "uni"          // from Sunway University
            : "pro";                                            // from the internship onwards
  if (pl.dataset.era !== era) pl.dataset.era = era;
  pl.classList.toggle("walking", !!dir);

  // sky, sun, moon, stars
  const [top, bot] = skyAt(p);
  $("#sky").style.background = `linear-gradient(${top}, ${bot})`;
  const sp = Math.min(1, p / .86);
  const sun = $("#sun");
  sun.style.left = `calc(${8 + sp * 78}% - 38px)`;
  sun.style.top = `${62 - Math.sin(sp * Math.PI) * 50}%`;
  sun.style.opacity = 1 - smooth(.8, .9, p);
  $("#moon").style.opacity = smooth(.86, .97, p);
  $("#stars").style.opacity = smooth(.82, 1, p);
  const dark = smooth(.68, 1, p);
  document.documentElement.style.setProperty("--dark", dark.toFixed(3));
  document.body.classList.toggle("night", p > .8);
  document.querySelectorAll(".cloud").forEach(c => {
    const x = ((+c.dataset.x * vw - cam * +c.dataset.speed + now * .006) % (vw * 1.6) + vw * 1.6) % (vw * 1.6) - 200;
    c.style.left = x + "px";
  });

  // timeline
  tl.querySelector(".fill").style.width = p * 100 + "%";
  tl.querySelector(".you").style.left = p * 100 + "%";
  tl.querySelector(".you").textContent = p > .95 ? "😎" : p > .45 ? "🙂" : "🧒";
  const here = STOPS.reduce((a, s) => Math.abs(s.x - px) < Math.abs(a.x - px) ? s : a);
  const capText = `<b>${here.year}</b> · ${here.title}`;
  const capHere = document.getElementById("capHere");
  if (capHere && capHere.innerHTML !== capText) capHere.innerHTML = capText;

  // which stop are we standing at?
  let best = -1, bd = 150;
  STOPS.forEach((s, i) => {
    const d = Math.abs(s.x - px); if (d < bd) { bd = d; best = i; }
    s.tick.classList.toggle("done", px >= s.x - 4);
  });
  if (best !== nearIdx) {
    if (nearIdx >= 0) STOPS[nearIdx].el.classList.remove("near");
    if (best >= 0) STOPS[best].el.classList.add("near");
    nearIdx = best;
  }
  requestAnimationFrame(frame);
}

function barcode(text) {

const STOPWORDS = new Set("a an and or the of in on with for to i my me is are be using use used experience skills skill knowledge ability able strong".split(" "));
const reEsc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// whole words only (plurals allowed), so "rest" never lights up inside "restaurant"
const termSrc = (t) => `(?<![a-z0-9])${reEsc(t)}${/[a-z]$/i.test(t) && t.length > 2 ? "(?:s|es)?" : ""}(?![a-z0-9+#])`;
function expandQuery(q) {
  const raw = q.toLowerCase().trim();
  if (!raw) return [];
  // a known phrase ("machine learning", "unit testing") is searched as a phrase, not word by word
  const known = SYN.some(g => g.includes(raw));
  const base = new Set(known ? [raw] : [raw, ...raw.split(/[\s,;/]+/).filter(w => w && !STOPWORDS.has(w))]);
  const terms = new Set(base);
  // add related words for what was typed only (no chains: valuation → beta → risk → …)
  for (const g of SYN) if (g.some(t => base.has(t))) g.forEach(t => terms.add(t));
  return [...terms].sort((a, b) => b.length - a.length);
}
const hits = (text, terms) => terms.some(t => new RegExp(termSrc(t), "i").test(text));
const highlight = (text, terms) => esc(text).replace(new RegExp(terms.map(termSrc).join("|"), "gi"), m => `<mark>${m}</mark>`);

const SECTIONS = {
  experience: { label: "Experience", color: "#4057c9" },
  projects: { label: "Project", color: "#2f8f5b" },

  skills: { label: "Toolkit", color: "#c98a12" },
  languages: { label: "Language", color: "#c2477a" },
};
function searchResume(q) {
  const terms = expandQuery(q);
  if (!terms.length) return null;
  const evidence = [];
  for (const sec of ["experience", "projects", "education"]) for (const it of RESUME[sec]) {
    const tagHits = it.tech.filter(t => hits(t, terms));
    const titleHit = hits(`${it.title} ${it.role || ""}`, terms);
    const pts = it.points.filter(p => hits(p, terms));
    const score = tagHits.length * 5 + (titleHit ? 3 : 0) + pts.length * 2;
    if (score) evidence.push({ sec, it, tagHits, pts, score });
  }
  evidence.sort((a, b) => b.score - a.score);
  const listed = RESUME.skills.map(g => ({ g, items: g.items.filter(s => hits(s, terms)) })).filter(x => x.items.length);
  const langs = RESUME.languages.filter(l => hits(l, terms));
  return { terms, evidence, listed, langs };
}

// Shrink the whole live world so it sits exactly inside the picture frame.
function frameFit() {
  const r = photo.getBoundingClientRect(), b = parseFloat(getComputedStyle(photo).borderTopWidth) || 0;
  const fx = r.left + b, fy = r.top + b, fw = r.width - 2 * b, fh = r.height - 2 * b;
  const vw = innerWidth, vh = innerHeight, s = Math.max(fw / vw, fh / vh);
  const w = fw / s, h = fh / s, l = (vw - w) / 2, t = vh - h;  // keep the road (bottom) in shot
  return {
    transform: `translate(${fx - s * l}px, ${fy - s * t}px) scale(${s})`,
    clip: `inset(${t}px ${vw - l - w}px 0px ${l}px)`,
  };
}
function placeInFrame() {
  if (mode !== "home") return;
  const f = frameFit();
  game.style.transform = f.transform;
  game.style.clipPath = f.clip;
  holePunch();
}
function enterRoad(openIdx = null, autoWalk = false) {

    game.style.clipPath = "inset(0px 0px 0px 0px)";
  }));
  setTimeout(() => {
    mode = "game"; game.style.transition = ""; game.style.clipPath = "none";
    document.body.classList.add("in-game");
    $("#backBtn").focus({ preventScroll: true });
    if (autoWalk) startTour();

      else { target = STOPS[openIdx].x; openOnArrive = openIdx; }

}

// Apple's official 30-second preview (iTunes Search API), played by a plain <audio> element, looping.
const Bgm = {
  audio: null, playing: false, muted: true, heldFor: null, track: null,
  wanted: (() => { try { return localStorage.getItem("hitisaac-bgm") !== "off"; } catch { return true; } })(),
  async find() {   // look the song up once: preview clip, album, year, Apple Music link
    if (this.track) return this.track;
    const url = `https://itunes.apple.com/search?term=${encodeURIComponent(`${BGM.artist} ${BGM.title}`)}&media=music&entity=song&limit=15`;
    const res = await (await fetch(url)).json();
    const want = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
    this.track = res.results.find(t => t.artistName === BGM.artist && want(t.trackName) === want(BGM.title) && t.previewUrl)
              || res.results.find(t => t.previewUrl);
    const t = this.track;
    // hovering the music chip or the record shows what's playing, with credit to Apple Music
    const info = `${BGM.title} · ${BGM.artist} (${t.collectionName}, ${(t.releaseDate || "").slice(0, 4)}) · 30-second preview via Apple Music`;
    document.querySelectorAll("#musicChip, #deck").forEach(el => el.title = info);
    return t;
  },
  async start(muted = false) {
    try {
      const t = await this.find();
      if (!this.audio) {
        this.audio = new Audio(t.previewUrl);
        this.audio.loop = true;                    // loop forever
        this.audio.volume = BGM.volume;
        ["play", "playing"].forEach(ev => this.audio.addEventListener(ev, () => { this.playing = true; this.paint(); }));
        ["pause", "ended"].forEach(ev => this.audio.addEventListener(ev, () => { this.playing = false; this.paint(); }));
      }
      this.muted = this.audio.muted = muted;
      await this.audio.play();
    } catch (err) {
      // browsers refuse sound before the first click: fall back to spinning silently until then
      if (!muted && err?.name === "NotAllowedError") return this.start(true);
      this.paint();
    }
  },
  unmute() {
    this.muted = false;
    if (this.audio) { this.audio.muted = false; if (this.audio.paused) this.audio.play().catch(() => {}); }
    else this.start(false);
    this.paint();
  },
  remember(on) { this.wanted = on; try { localStorage.setItem("hitisaac-bgm", on ? "on" : "off"); } catch {} },
  toggle() {   // the record player: sound on / pause / play, and remember the visitor's choice
    if (!this.audio) { this.remember(true); this.start(false); return; }
    if (this.muted) { this.remember(true); this.unmute(); return; }   // first press while silently spinning = sound on
    if (this.playing) { this.remember(false); this.audio.pause(); }
    else { this.remember(true); this.audio.play().catch(() => {}); }
  },
  hold(reason) { if (this.playing) { this.heldFor = reason; this.audio.pause(); } },
  release(reason) { if (this.heldFor === reason) { this.heldFor = null; this.audio.play().catch(() => {}); } },
  paint() {
    const on = this.playing && !this.muted;
    $("#deck").classList.toggle("playing", this.playing);
    $("#deck .deck-hint").textContent = !this.playing ? "▶ play" : this.muted ? "🔇 click for sound" : "❚❚ pause";
    const chip = $("#musicChip");
    if (chip) { chip.classList.toggle("on-air", on); chip.setAttribute("aria-pressed", on); }
  },
};
$("#deck").onclick = () => { Sfx.play("soft"); Bgm.toggle(); };
$("#musicChip")?.addEventListener("click", () => Bgm.toggle());
if (Bgm.wanted) {
  // try to play straight away; if the browser blocks sound, spin silently and turn sound on at the first click or key
  Bgm.start(false);
  const first = (e) => {
    removeEventListener("pointerdown", first, true); removeEventListener("keydown", first, true);
    if (e.target.closest?.("#deck, #musicChip")) return;   // the deck / music chip handle their own click
    Bgm.unmute();
  };
  addEventListener("pointerdown", first, true);
  addEventListener("keydown", first, true);
} else {
  Bgm.find().catch(() => {});   // the visitor paused it last time: just show what's on the record
}

/* --- click sounds: tiny tones made in the browser, no audio files --- */
const Sfx = {
  on: (() => { try { return localStorage.getItem("hitisaac-sound") !== "off"; } catch { return true; } })(),
  ctx: null,
  ac() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); return this.ctx; },
  tone(f1, f2, dur, vol, type = "sine", delay = 0) {
    const c = this.ac(), t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
  },
  paper() {   // a soft rustle for things pinned on the board
    const c = this.ac(), n = c.sampleRate * .09, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = .8; g.gain.value = .22;
    s.buffer = buf; s.connect(f).connect(g).connect(c.destination); s.start();
  },
  play(kind) {
    if (!this.on) return;
    try {
      if (kind === "chip") { this.tone(520, 880, .09, .12); this.tone(1320, 1320, .07, .04, "sine", .04); }
      else if (kind === "board") { this.paper(); this.tone(300, 180, .08, .08, "triangle"); }
      else if (kind === "soft") this.tone(900, 700, .05, .06);
    } catch { /* audio not available: stay silent */ }
  },
};
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest(".uni-chip, [data-chip]")) Sfx.play("chip");
  else if (t.closest(".board .item")) Sfx.play("board");
  else if (t.closest(".finder-try button, .hud-btn, .x, [data-open], [data-open-card]")) Sfx.play("soft");
}, true);
const soundBtn = $("#soundBtn");
const showSound = () => { soundBtn.textContent = Sfx.on ? "🔊 sound on" : "🔇 sound off"; soundBtn.setAttribute("aria-pressed", Sfx.on); };
soundBtn.onclick = () => {
  Sfx.on = !Sfx.on; showSound();
  try { localStorage.setItem("hitisaac-sound", Sfx.on ? "on" : "off"); } catch {}
  if (Sfx.on) Sfx.play("chip");
};
showSound();

/* --- go ----------------------------------------------------------------- */
buildWorld();
buildScenery();
addEventListener("resize", () => { seed = 99; buildScenery(); });
placeInFrame();
document.body.classList.add("ready");
document.fonts?.ready.then(placeInFrame);
requestAnimationFrame(frame);
</script>
